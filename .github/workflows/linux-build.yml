name: Emu293 Linux build check

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - ".github/workflows/linux-build.yml"
  push:
    branches: ["main", "master", "ci/linux-build-check"]
    paths:
      - "src/**"
      - ".github/workflows/linux-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev zlib1g-dev libwxgtk3.2-dev libv4l-dev

      - name: Compile emulator
        run: make -C src -j2
